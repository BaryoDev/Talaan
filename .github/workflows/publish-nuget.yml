name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Lets the runner mint the OIDC token nuget.org exchanges for a short-lived key.
      id-token: write
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check version matches the csproj
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::not a version number: $VERSION"
            exit 1
          fi
          csproj=$(grep -oP '(?<=<Version>)[^<]+' src/Talaan/Talaan.csproj)
          if [ "$csproj" != "$VERSION" ]; then
            echo "::error::input version $VERSION does not match csproj $csproj"
            exit 1
          fi

      - name: Restore & build
        run: |
          dotnet restore
          dotnet build src/Talaan/Talaan.csproj --configuration Release --no-restore /p:Version="$VERSION"

      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        run: dotnet pack src/Talaan/Talaan.csproj --configuration Release --no-build --output ./nupkgs /p:Version="$VERSION"

      # Trusted publishing: no long-lived key. Runs after tests so a failed test never asks for a token.
      - name: Exchange OIDC token for a short-lived NuGet key
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || 'arnelirobles' }}

      - name: Publish
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::No API key returned. Check the trusted publishing policy on nuget.org."
            exit 1
          fi
          dotnet nuget push ./nupkgs/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Tag release
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

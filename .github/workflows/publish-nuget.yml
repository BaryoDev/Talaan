name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.1.0)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check version matches the csproj
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::not a version number: $VERSION"
            exit 1
          fi
          csproj=$(grep -oP '(?<=<Version>)[^<]+' src/Talaan/Talaan.csproj)
          if [ "$csproj" != "$VERSION" ]; then
            echo "::error::input version $VERSION does not match csproj $csproj"
            exit 1
          fi

      - name: Restore & build
        run: |
          dotnet restore
          dotnet build src/Talaan/Talaan.csproj --configuration Release --no-restore /p:Version="$VERSION"

      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        run: dotnet pack src/Talaan/Talaan.csproj --configuration Release --no-build --output ./nupkgs /p:Version="$VERSION"

      - name: Check for NuGet API key
        run: |
          if [ -z "${{ secrets.NUGET_API_KEY }}" ]; then
            echo "::error::NUGET_API_KEY secret is not set (org or repo)."
            exit 1
          fi

      - name: Publish
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Tag release
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
